    <script>
      (function () {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}

        window.addEventListener('error', function (e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        });
      })();
    </script>
